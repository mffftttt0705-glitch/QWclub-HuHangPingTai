<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QW电竞外派 - 专业代练外派担保平台</title>
<script>
// 仅样式依赖 Tailwind CDN；即使加载失败，页面功能也不受影响
(function(){var u=['https://cdn.tailwindcss.com','https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'],i=0;(function n(){if(i>=u.length)return;var s=document.createElement('script');s.src=u[i++];s.onerror=function(){s.remove();n()};document.head.appendChild(s)})()})();
</script>
<style>body{margin:0;background:#f1f5f9;-webkit-tap-highlight-color:transparent}#app{max-width:28rem;margin:0 auto;background:#fff;min-height:100vh}button{cursor:pointer}input,select,textarea{box-sizing:border-box}</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">
<div id="app" class="max-w-md mx-auto relative min-h-screen bg-white shadow-xl border-x border-slate-200"><div style="padding:24px;text-align:center;font-size:14px">页面加载中…</div></div>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v || 0).toFixed(2);
const RT = {employer:'派单员', booster:'打手', admin:'管理员'};
const ST = ['待接单','代练中','待验收','待结算','已完成'];
const SC = ['bg-amber-100 text-amber-700','bg-blue-100 text-blue-700','bg-indigo-100 text-indigo-700','bg-purple-100 text-purple-700','bg-emerald-100 text-emerald-700'];
const GAMES = [['王者荣耀','极速上分'],['英雄联盟','端游竞技'],['三角洲行动','热门战术'],['和平精英','吃鸡代练']];
const I = 'w-full bg-slate-50 border rounded-lg p-2.5 mt-1 outline-none font-bold text-xs';
const B = 'w-full text-white font-black py-2 rounded-xl text-xs ';
// 代码绘制的 SVG 图标（线条风格，颜色跟随文字）
const P = {
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  gamepad: '<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.42.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26A4 4 0 0 0 17.32 5z"/>',
  swords: '<path d="m14.5 17.5-11.5-11.5V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="m14.5 6.5 3.5-3.5h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic = (n, px) => `<svg width="${px || 16}" height="${px || 16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;vertical-align:-0.15em">${P[n]}</svg>`;
let token = ''; try { token = localStorage.getItem('qw_token') || ''; } catch (e) {}
const S = { tab:'publish', kw:'', st:'', user:null, users:[], orders:[], modal:'', mode:'login', sel:null, target:null, adjType:'add', proof:'', amt:100,
  a:{username:'', password:'', role:'employer', adminKey:''},
  f:{title:'', gameName:'王者荣耀', gameRegion:'安卓微信', timeLimit:'24小时完工', description:'', bounty:100, deposit:200} };

function toast(msg, err) {
  const d = document.createElement('div');
  d.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold border ' + (err ? 'bg-red-500 text-white border-red-600' : 'bg-emerald-600 text-white border-emerald-700');
  d.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 16px;border-radius:12px;color:#fff;font-size:12px;background:' + (err ? '#ef4444' : '#059669');
  d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2500);
}
function setToken(t) { token = t; try { t ? localStorage.setItem('qw_token', t) : localStorage.removeItem('qw_token'); } catch (e) {} }
async function diagnose() {
  try {
    const h = await (await fetch('/api/health')).json();
    if (!h.db) return '后端未绑定 D1 数据库（绑定变量名必须是 DB）';
    if (!h.jwt) return '后端未设置密钥 JWT_SECRET';
    if (h.schema !== 'ok') return '数据库表结构有问题：' + h.schema + '（请执行 schema.sql）';
  } catch (e) { return '无法连接后端接口 /api，请确认后端 Worker 与页面部署在同一个域名下'; }
  return '';
}
async function api(method, path, body) {
  let r;
  try { r = await fetch('/api' + path, { method, headers: Object.assign({'Content-Type':'application/json'}, token ? {Authorization:'Bearer ' + token} : {}), body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('网络连接失败，请检查网络后重试'); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { setToken(''); S.user = null; render(); }
  if (!r.ok) {
    if (r.status >= 500 || !d.error) throw new Error((await diagnose()) || d.error || '请求失败(状态码 ' + r.status + ')');
    throw new Error(d.error);
  }
  return d;
}
const loadOrders = async () => { try { S.orders = await api('GET', '/orders/list'); } catch (e) {} };
const loadUsers = async () => { try { S.users = await api('GET', '/admin/users'); } catch (e) {} };
const refreshMe = async () => { if (!token) return; try { S.user = await api('GET', '/me'); } catch (e) {} };

function orderCard(o) {
  const u = S.user, id = u && u.id; let b = '';
  if (o.status === 0 && u && u.role === 'booster') b = `<button data-act="accept" data-id="${o.id}" class="${B}bg-emerald-500">1. 立即接单 (扣保证金 ¥${o.deposit})</button>`;
  else if (o.status === 1 && u && id === o.booster_id) b = `<button data-act="openProof" data-id="${o.id}" class="${B}bg-blue-600">2. 提交完工凭证</button>`;
  else if (o.status === 2 && u && (id === o.employer_id || u.role === 'admin')) b = `<button data-act="confirm" data-id="${o.id}" class="${B}bg-amber-500">3. 派单员验收通过 (提交管理员打款)</button>`;
  else if (o.status === 3 && u && u.role === 'admin') b = `<button data-act="settle" data-id="${o.id}" class="${B}bg-purple-600">4. 管理员一键打款结算 (退保证金+发放赏金)</button>`;
  else if (o.status === 4) b = `<div class="text-[10px] text-center text-emerald-600 font-bold py-1">${ic('check', 12)} 该订单已全部结算完毕</div>`;
  return `<div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2" style="margin-bottom:12px">
    <div class="flex justify-between items-start"><span class="text-xs text-slate-400 font-mono">单号: ${esc(o.display_id)}</span><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${SC[o.status] || ''}">${ST[o.status] || '未知'}</span></div>
    <h4 class="font-bold text-sm text-slate-800">${esc(o.title)}</h4>
    <div class="text-[11px] text-slate-500 flex gap-1.5 flex-wrap"><span class="bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded">${esc(o.game_name)}</span><span class="bg-slate-100 px-2 py-0.5 rounded">${esc(o.game_region)}</span><span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded">限时: ${esc(o.time_limit)}</span></div>
    <div class="bg-slate-50 p-2 rounded-xl text-xs text-slate-600 whitespace-pre-wrap">${esc(o.description || '无特殊要求')}</div>
    ${o.proof_img ? `<div class="bg-emerald-50 p-2 rounded-lg text-xs text-emerald-800 border border-emerald-100 font-medium">完工凭证: ${esc(o.proof_img)}</div>` : ''}
    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-xl text-center"><div><div class="text-[10px] text-slate-400">派单赏金</div><div class="text-red-500 font-black text-sm">¥ ${o.bounty}</div></div><div><div class="text-[10px] text-slate-400">打手保证金</div><div class="text-orange-500 font-black text-sm">¥ ${o.deposit}</div></div></div>
    <div class="pt-1">${b}</div></div>`;
}
function listHtml() {
  const kw = S.kw.trim().toLowerCase();
  const l = S.orders.filter(o => (S.st === '' || o.status === S.st) && (!kw || String(o.title).toLowerCase().includes(kw) || String(o.game_name).toLowerCase().includes(kw)));
  return l.length ? l.map(orderCard).join('') : '<div class="text-center py-8 text-slate-400 text-xs">暂无符合条件的订单</div>';
}
const renderList = () => { const el = $('#list'); if (el) el.innerHTML = listHtml(); };
const inp = (m, v, ph, cls, type, n) => `<input data-m="${m}" ${n ? 'data-n="1"' : ''} type="${type || 'text'}" value="${esc(v)}" placeholder="${ph}" class="${cls || I}">`;
const modal = (t, b) => `<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"><div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl" style="background:#fff;width:100%;max-width:24rem;border-radius:16px;padding:20px"><div class="flex justify-between items-center border-b pb-2">${t}<button data-act="close" class="text-slate-400">${ic('x', 18)}</button></div>${b}</div></div>`;

function modalHtml() {
  const a = S.a, f = S.f, BT = 'w-full bg-blue-600 text-white font-black py-2.5 rounded-xl shadow mt-2 text-xs';
  if (S.modal === 'auth') return modal(`<div class="flex gap-4 font-black text-sm"><button data-act="mode" data-v="login" class="${S.mode === 'login' ? 'text-blue-600 border-b-2 border-blue-600 pb-1' : 'text-slate-400'}">账号登录</button><button data-act="mode" data-v="register" class="${S.mode === 'register' ? 'text-blue-600 border-b-2 border-blue-600 pb-1' : 'text-slate-400'}">注册新账号</button></div>`,
    `<div class="space-y-3 text-xs"><div><label class="text-slate-500 font-medium">账号名称</label>${inp('a.username', a.username, '输入账号名称')}</div><div><label class="text-slate-500 font-medium">密码</label>${inp('a.password', a.password, '输入密码', I, 'password')}</div>` +
    (S.mode === 'register' ? `<div><label class="text-slate-500 font-medium">选择账号身份角色</label><select data-m="a.role" class="${I}">${Object.keys(RT).map(k => `<option value="${k}" ${a.role === k ? 'selected' : ''}>${RT[k]}</option>`).join('')}</select></div>` +
      (a.role === 'admin' ? `<div class="p-2 bg-amber-50 border border-amber-200 rounded-lg text-[11px] text-amber-800">* 管理员授权密钥：${inp('a.adminKey', a.adminKey, '首个管理员可留空；之后需填密钥', I, 'password')}</div>` : '') : '') +
    `<button data-act="${S.mode}" class="${BT}">${S.mode === 'login' ? '立即登录' : '确认注册'}</button></div>`);
  if (S.modal === 'publish') return modal('<h3 class="font-black text-sm">发布代练需求</h3>',
    `<div class="space-y-2 text-xs">${inp('f.title', f.title, '代练需求标题')}<div class="grid grid-cols-2 gap-2">${inp('f.gameName', f.gameName, '游戏名称')}${inp('f.gameRegion', f.gameRegion, '游戏区服')}</div>${inp('f.timeLimit', f.timeLimit, '代练时限')}<textarea data-m="f.description" rows="2" placeholder="详细需求描述..." class="${I}">${esc(f.description)}</textarea><div class="grid grid-cols-2 gap-2">${inp('f.bounty', f.bounty, '托管赏金(元)', I, 'number', 1)}${inp('f.deposit', f.deposit, '打手保证金(元)', I, 'number', 1)}</div><div class="text-[10px] text-slate-400">发布时将从可用余额中托管赏金</div><button data-act="create" class="${BT}">发布并上架</button></div>`);
  if (S.modal === 'proof') return modal('<h3 class="font-black text-sm">提交完工凭证</h3>', `<div class="space-y-3 text-xs"><label class="text-slate-500 font-medium">完工说明 / 战绩截图说明</label><textarea data-m="proof" rows="3" placeholder="填写完工信息..." class="${I}">${esc(S.proof)}</textarea><button data-act="submitProof" class="${BT}">确认提交</button></div>`);
  if (S.modal === 'adjust') return modal('<h3 class="font-black text-sm">用户余额调账</h3>', `<div class="space-y-3 text-xs"><div class="bg-purple-50 p-2.5 rounded-xl text-purple-900 border border-purple-100">目标账号：<b>${esc(S.target && S.target.username)}</b><br>当前余额：<b class="text-red-500">¥${num(S.target && S.target.balance)}</b></div><label class="text-slate-500 font-medium">${S.adjType === 'add' ? '增加金额 (元)' : '扣除金额 (元)'}</label>${inp('amt', S.amt, '金额', I, 'number', 1)}<button data-act="adjust" class="${BT}">确认调账</button></div>`);
  return '';
}

function render() {
  const u = S.user; let body = '';
  if (S.tab === 'publish') body = `<div class="p-4 space-y-4"><div class="bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 p-4 rounded-2xl text-white shadow-lg"><div class="flex justify-between items-center mb-3"><div><h3 class="font-extrabold text-sm flex items-center gap-1.5">${ic('shield', 16)}<span>平台托管代练 · 安全担保</span></h3><p class="text-[11px] text-blue-100 mt-0.5">资金托管担保 极速匹配优质打手</p></div><button data-act="openPublish" class="bg-amber-400 text-slate-900 font-black text-xs px-3 py-1 rounded-full shadow">发布需求</button></div><div class="grid grid-cols-2 gap-2">${GAMES.map(g => `<div data-act="openPublish" data-g="${g[0]}" class="bg-white/15 p-3 rounded-xl border border-white/20 flex justify-between items-center cursor-pointer"><div><div class="font-black text-xs text-white">${g[0]}</div><div class="text-[9px] text-blue-100 mt-0.5">${g[1]}</div></div><span class="bg-amber-400 text-slate-900 font-black text-[9px] px-2 py-0.5 rounded-full">发单</span></div>`).join('')}</div></div></div>`;
  else if (S.tab === 'hall') body = `<div class="p-4 space-y-3"><div class="flex gap-2 items-center">${inp('kw', S.kw, '搜索游戏 / 标题 / 需求', 'flex-1 bg-slate-100 border border-slate-200 rounded-full px-3.5 py-1.5 text-xs outline-none')}<button data-act="refresh" class="bg-slate-100 p-2 rounded-full text-slate-600">${ic('refresh', 14)}</button></div><div class="flex justify-between bg-slate-100 p-1 rounded-xl text-xs">${[['', '全部']].concat(ST.map((t, i) => [i, t])).map(([v, l]) => `<button data-act="st" data-v="${v}" class="flex-1 py-1 rounded-lg font-bold text-center ${S.st === v ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}">${l}</button>`).join('')}</div><div id="list" class="space-y-3">${listHtml()}</div></div>`;
  else body = `<div class="p-4 space-y-4"><div class="bg-gradient-to-br from-slate-900 to-slate-800 p-4 rounded-2xl text-white shadow-xl flex justify-between items-center"><div><h3 class="font-black text-sm">${u ? esc(u.username) + ` <span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/30">${RT[u.role]}</span>` : '游客未登录'}</h3><p class="text-[10px] text-slate-400 font-mono mt-0.5">账号编号: ${u ? esc(u.user_code) : '-'}</p></div>${u ? '' : '<button data-act="openAuth" data-v="login" class="text-xs bg-blue-600 px-3 py-1.5 rounded-full font-bold">登录 / 注册</button>'}</div>
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm"><span class="font-extrabold text-xs">个人资产中心</span><div class="grid grid-cols-2 gap-2 text-center bg-slate-50 p-3 rounded-xl border mt-2"><div><div class="text-[10px] text-slate-400">可用余额</div><div class="text-red-500 font-black text-lg">¥ ${num(u && u.balance)}</div></div><div><div class="text-[10px] text-slate-400">冻结金额(保证金/托管赏金)</div><div class="text-orange-500 font-black text-lg">¥ ${num(u && u.frozen_deposit)}</div></div></div></div>
    ${u && u.role === 'admin' ? `<div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 space-y-3"><div class="flex justify-between items-center border-b border-purple-200 pb-2"><h3 class="font-black text-xs text-purple-900">管理员控制台</h3><button data-act="loadUsers" class="text-[10px] text-purple-600 underline font-bold">刷新用户列表</button></div><div class="space-y-1.5" style="max-height:12rem;overflow-y:auto">${S.users.map(x => `<div class="flex justify-between items-center bg-white p-2 rounded-lg border text-xs"><div><span class="font-bold">${esc(x.username)}</span><span class="text-[10px] text-slate-400 ml-1">(${RT[x.role]})</span><div class="text-[10px] text-red-500 font-bold">余额: ¥${num(x.balance)}</div></div><div class="flex gap-1"><button data-act="openAdjust" data-id="${x.id}" data-t="add" class="text-emerald-600 text-[10px] bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 font-bold">+ 加余额</button><button data-act="openAdjust" data-id="${x.id}" data-t="reduce" class="text-red-600 text-[10px] bg-red-50 px-2 py-0.5 rounded border border-red-200 font-bold">- 扣余额</button></div></div>`).join('')}</div></div>` : ''}</div>`;
  const nav = [['publish', 'gamepad', '发单'], ['hall', 'swords', '接单大厅'], ['mine', 'user', '我的']].map(([k, n, l]) => `<button data-act="tab" data-v="${k}" class="flex flex-col items-center gap-1 ${S.tab === k ? 'text-blue-600 font-black' : 'text-slate-400'}">${ic(n, 22)}<span class="text-[10px]">${l}</span></button>`).join('');
  app.innerHTML = `<div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-30"><div><h1 class="text-2xl font-black bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent">QW电竞外派</h1><p class="text-[10px] text-slate-400 font-medium">专业电竞代练外派担保服务</p></div>${u ? '<button data-act="logout" class="bg-slate-100 text-slate-600 font-bold text-xs px-3 py-1.5 rounded-full border">退出登录</button>' : '<button data-act="openAuth" data-v="login" class="bg-blue-600 text-white font-bold text-xs px-3.5 py-1.5 rounded-full shadow">登录 / 注册</button>'}</div>${body}${modalHtml()}
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t grid grid-cols-3 py-2 z-40 text-center" style="position:fixed;bottom:0;left:0;right:0;max-width:28rem;margin:0 auto;background:#fff;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0;z-index:40">${nav}</nav>`;
}

async function onAuth(r, msg) { setToken(r.token); S.user = r.user; S.modal = ''; S.a.password = ''; toast(msg); if (r.user.role === 'admin') await loadUsers(); render(); }
const A = {
  async tab(d) { S.tab = d.v; if (d.v === 'hall') await loadOrders(); if (d.v === 'mine' && S.user && S.user.role === 'admin') await loadUsers(); render(); },
  openAuth(d) { S.mode = d.v || 'login'; S.modal = 'auth'; render(); },
  mode(d) { S.mode = d.v; render(); },
  close() { S.modal = ''; render(); },
  async login() { await onAuth(await api('POST', '/login', { username: S.a.username, password: S.a.password }), '登录成功'); },
  async register() { await onAuth(await api('POST', '/register', S.a), '注册成功'); },
  logout() { setToken(''); S.user = null; S.users = []; toast('已退出账号登录'); render(); },
  openPublish(d) { if (!S.user) return toast('请先登录或注册账号！', 1); if (d.g) { S.f.gameName = d.g; S.f.title = d.g + ' 段位提升需求订单'; } S.modal = 'publish'; render(); },
  async create() { await api('POST', '/orders/create', S.f); toast('需求发布成功！赏金已托管'); S.modal = ''; S.tab = 'hall'; await refreshMe(); await loadOrders(); render(); },
  async accept(d) { await api('POST', '/orders/accept', { orderId: +d.id }); toast('接单成功！已扣除保证金'); await refreshMe(); await loadOrders(); render(); },
  openProof(d) { S.sel = +d.id; S.proof = ''; S.modal = 'proof'; render(); },
  async submitProof() { if (!S.proof.trim()) return toast('请填写完工说明', 1); await api('POST', '/orders/complete', { orderId: S.sel, proofImg: S.proof }); toast('完工凭证提交成功！'); S.modal = ''; await loadOrders(); render(); },
  async confirm(d) { await api('POST', '/orders/confirm', { orderId: +d.id }); toast('已确认验收！已提交管理员打款'); await loadOrders(); render(); },
  async settle(d) { await api('POST', '/orders/admin-settle', { orderId: +d.id }); toast('结算成功！已发放赏金并退还保证金'); await refreshMe(); await loadOrders(); render(); },
  async refresh() { await loadOrders(); renderList(); },
  st(d) { S.st = d.v === '' ? '' : +d.v; render(); },
  async loadUsers() { await loadUsers(); render(); },
  openAdjust(d) { S.target = S.users.find(x => x.id == d.id); S.adjType = d.t; S.amt = 100; S.modal = 'adjust'; render(); },
  async adjust() { if (!(S.amt > 0)) return toast('请输入有效调账金额', 1); await api('POST', '/admin/adjust-balance', { targetUserId: S.target.id, amount: +S.amt, type: S.adjType }); toast('调账成功！'); S.modal = ''; await loadUsers(); await refreshMe(); render(); }
};
app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || !A[el.dataset.act]) return;
  try { await A[el.dataset.act](el.dataset); } catch (x) { toast(x.message || '操作失败', 1); }
});
const onIn = e => {
  const el = e.target, m = el.dataset && el.dataset.m; if (!m) return;
  const k = m.split('.'); let o = S; while (k.length > 1) o = o[k.shift()];
  o[k[0]] = el.dataset.n ? Number(el.value) : el.value;
  if (m === 'kw') renderList();
  if (m === 'a.role' && e.type === 'change') render();
};
app.addEventListener('input', onIn); app.addEventListener('change', onIn);
app.addEventListener('keydown', e => { if (e.key === 'Enter' && S.modal === 'auth' && e.target.tagName === 'INPUT') A[S.mode]().catch(x => toast(x.message, 1)); });
window.addEventListener('error', e => toast('脚本错误: ' + e.message, 1));
(async () => { render(); await refreshMe(); await loadOrders(); if (S.user && S.user.role === 'admin') await loadUsers(); render(); })();
</script>
