<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息 - 怪兽电竞</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="message-tabs">
            <div class="message-tab active" data-tab="official">官方消息</div>
            <div class="message-tab" data-tab="conversation">会话消息</div>
        </div>

        <div class="message-content" id="official-content">
            <div class="message-list">
                <div class="message-item">
                    <div class="message-avatar">🤖</div>
                    <div class="message-info">
                        <div class="message-title">三角洲客服</div>
                        <div class="message-desc">三角洲在线客服</div>
                    </div>
                    <div class="message-action">点击联系</div>
                </div>

                <div class="message-item">
                    <div class="message-avatar">📋</div>
                    <div class="message-info">
                        <div class="message-title">系统消息</div>
                        <div class="message-desc">暂无消息</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="message-content" id="conversation-content" style="display: none;">
            <div class="empty-state">
                <div class="empty-icon">📄</div>
                <div class="empty-text">数据为空</div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="/" class="nav-item">
                <div class="nav-icon">🏠</div>
                <div class="nav-text">首页</div>
            </a>
            <a href="/category.html" class="nav-item">
                <div class="nav-icon">⊞</div>
                <div class="nav-text">分类</div>
            </a>
            <a href="/hitman.html" class="nav-item">
                <div class="nav-icon">🎯</div>
                <div class="nav-text">打手</div>
            </a>
            <a href="/message.html" class="nav-item active">
                <div class="nav-icon">🔔</div>
                <div class="nav-text">消息</div>
            </a>
            <a href="/my.html" class="nav-item">
                <div class="nav-icon">👤</div>
                <div class="nav-text">我的</div>
            </a>
        </nav>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
