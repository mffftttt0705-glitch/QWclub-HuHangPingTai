<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 怪兽电竞</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="user-header">
            <div class="user-avatar">👤</div>
            <div class="user-info">
                <div class="user-name">立即登录 <span class="user-level">👑 Lv.1</span></div>
                <div class="user-id">用户ID: 未登陆</div>
            </div>
            <div class="user-actions">
                <button class="btn btn-primary">⇄ 老板</button>
            </div>
        </div>

        <div class="orders-section">
            <div class="section-header">
                <div class="section-title">我的订单</div>
                <div class="section-more">全部 &gt;</div>
            </div>
            <div class="orders-grid">
                <div class="order-item">
                    <div class="order-icon">💳</div>
                    <div class="order-text">待付款</div>
                </div>
                <div class="order-item">
                    <div class="order-icon">📦</div>
                    <div class="order-text">待接单</div>
                </div>
                <div class="order-item">
                    <div class="order-icon">💓</div>
                    <div class="order-text">服务中</div>
                </div>
                <div class="order-item">
                    <div class="order-icon">📋</div>
                    <div class="order-text">待结单</div>
                </div>
                <div class="order-item">
                    <div class="order-icon">💰</div>
                    <div class="order-text">退款</div>
                </div>
            </div>
        </div>

        <div class="balance-section">
            <div class="balance-card">
                <div class="balance-label">我的余额 &gt;</div>
                <div class="balance-amount">0</div>
            </div>
            <div class="balance-card contact">
                <div class="contact-label">实时在线</div>
                <div class="contact-title">联系客服</div>
            </div>
        </div>

        <div class="more-functions">
            <div class="section-title">更多功能</div>
            <div class="functions-grid">
                <div class="function-item">
                    <div class="function-icon">🎧</div>
                    <div class="function-text">订单投诉</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">🎟️</div>
                    <div class="function-text">领券中心</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">🏷️</div>
                    <div class="function-text">我的优惠券</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">⭐</div>
                    <div class="function-text">会员等级</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">📊</div>
                    <div class="function-text">排行榜</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">🎁</div>
                    <div class="function-text">福利活动</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">🏆</div>
                    <div class="function-text">打手招募</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">📢</div>
                    <div class="function-text">公告通知</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">✏️</div>
                    <div class="function-text">意见反馈</div>
                </div>
                <div class="function-item">
                    <div class="function-icon">🎮</div>
                    <div class="function-text">搭建同款</div>
                </div>
            </div>
        </div>

        <div class="platform-announcement">
            <div class="section-title">平台公告通知</div>
            <div class="announcement-content">
                <div class="announcement-title">怪兽开启规则全透明化！</div>
                <div class="announcement-text">
                    以下是打手接单守则<br>
                    打手只要违规，板板们就可以举报！<br>
                    俱乐部将罚款打手补偿给老板！
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="/" class="nav-item">
                <div class="nav-icon">🏠</div>
                <div class="nav-text">首页</div>
            </a>
            <a href="/category.html" class="nav-item">
                <div class="nav-icon">⊞</div>
                <div class="nav-text">分类</div>
            </a>
            <a href="/hitman.html" class="nav-item">
                <div class="nav-icon">🎯</div>
                <div class="nav-text">打手</div>
            </a>
            <a href="/message.html" class="nav-item">
                <div class="nav-icon">🔔</div>
                <div class="nav-text">消息</div>
            </a>
            <a href="/my.html" class="nav-item active">
                <div class="nav-icon">👤</div>
                <div class="nav-text">我的</div>
            </a>
        </nav>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
